# ============================================================================
# INTENTIONALLY INSECURE - SYNTHETIC DEMO for RelixQ. Do not copy to production.
# Legacy "acquired bank" core endpoint: TLS 1.0/1.1, 3DES/CBC, RSA-1024/SHA-1 cert.
# ============================================================================
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/legacy.crt;
    ssl_certificate_key /etc/nginx/certs/legacy.key;
    ssl_protocols       TLSv1 TLSv1.1;
    ssl_ciphers         "DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:AES128-SHA:AES256-SHA:@SECLEVEL=0";
    ssl_prefer_server_ciphers on;

    location / {
        default_type application/json;
        return 200 '{"service":"legacy-core","bank":"Acquired Legacy Bank","data_class":"SYNTHETIC","tls":"TLSv1.0/1.1","cipher":"3DES-CBC"}';
    }
}
